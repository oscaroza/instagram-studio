services:
  - type: web
    name: instagram-studio-v1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: APP_SECRET_KEY
        generateValue: true
      - key: STUDIO_ACCESS_CODE
        sync: false
      - key: STUDIO_SESSION_HOURS
        value: 24
      - key: STUDIO_COOKIE_SECURE
        value: true
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: INSTAGRAM_API_BASE
        value: https://graph.instagram.com
      - key: INSTAGRAM_API_VERSION
        value: v23.0
      - key: MAX_UPLOAD_MB
        value: 250
      - key: ENABLE_TRIAL_REELS
        value: false
