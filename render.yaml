services:
  - type: web
    name: instagram-studio-v1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: APP_SECRET_KEY
        generateValue: true
      - key: STUDIO_ACCESS_CODE
        sync: false
      - key: STUDIO_SESSION_HOURS
        value: 24
      - key: STUDIO_IDLE_MINUTES
        value: 10
      - key: STUDIO_COOKIE_SECURE
        value: true
      - key: CEREBRAS_MODEL
        value: openai/gpt-oss-20b
      - key: CEREBRAS_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: INSTAGRAM_API_BASE
        value: https://graph.instagram.com
      - key: INSTAGRAM_API_VERSION
        value: v26.0
      - key: MAX_UPLOAD_MB
        value: 250
      - key: ENABLE_TRIAL_REELS
        value: true
      - key: ENABLE_INSTAGRAM_STORIES
        value: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: instagram_studio
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: instagram-studio
      - key: MEDIA_STORAGE_BACKEND
        value: auto
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_FOLDER
        value: instagram-studio
      - key: CLOUDFLARE_ANALYTICS_API_TOKEN
        sync: false
      - key: CLOUDFLARE_BILLING_API_TOKEN
        sync: false
      - key: R2_MAX_STORAGE_GB
        value: 9
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SCHEDULER_INTERVAL_SECONDS
        value: 30
